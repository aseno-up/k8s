apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aseno-ingress
  namespace: aseno
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aseno.com.br
        - api.aseno.com.br
        - evo.aseno.com.br
      secretName: aseno-tls
  rules:
    - host: aseno.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.aseno.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
    - host: evo.aseno.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evolution
                port:
                  number: 80