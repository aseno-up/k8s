apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aseno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/aseno-up/backend:latest
          ports:
            - containerPort: 4901
          envFrom:
            - secretRef:
                name: aseno-secrets
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health
              port: 4901
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4901
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4901
            initialDelaySeconds: 5
            periodSeconds: 10
