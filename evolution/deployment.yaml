apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution
  namespace: aseno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evolution
  template:
    metadata:
      labels:
        app: evolution
    spec:
      containers:
        - name: evolution
          image: evoapicloud/evolution-api:v2.3.7
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: aseno-secrets
          env:
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: aseno-secrets
                  key: EVOLUTION_SERVER_URL
            - name: AUTHENTICATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aseno-secrets
                  key: EVOLUTION_AUTH_KEY
            - name: DATABASE_PROVIDER
              value: "postgresql"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aseno-secrets
                  key: EVOLUTION_DATABASE_URL
            - name: DATABASE_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: aseno-secrets
                  key: EVOLUTION_DATABASE_URL
            - name: DATABASE_CONNECTION_CLIENT_NAME
              value: "evolution_api"
            - name: CHATWOOT_ENABLED
              value: "true"
            - name: CACHE_REDIS_ENABLED
              value: "true"
            - name: CACHE_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: aseno-secrets
                  key: REDIS_URL
            - name: CACHE_REDIS_PREFIX_KEY
              value: "evolution"
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"
